<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyLove 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8e9ee;--ink:#3b2733;--pink:#d9648a;--glass:#ffffffb8;--line:#ebcdd8}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font:16px/1.4 Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;border:0;border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 1px 4px #0002}
button.on{background:var(--pink);color:#fff}
#home,#ed{position:absolute;inset:0;flex-direction:column;display:flex}
#ed{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;flex:1}
#grid{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;align-content:start}
.doc{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.doc .em{font-size:34px}.doc b{display:block;word-break:break-word}.doc small{opacity:.7}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid #fff}
.sw.on{outline:3px solid var(--pink)}
#ttl{font-weight:800;max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sc{flex:1;overflow:auto;background:#e4d3da;padding:14px;touch-action:none}
#fab{display:none;position:fixed;top:10px;right:10px;z-index:9;width:48px;height:48px;padding:0;border-radius:50%;background:var(--pink);color:#fff;font-size:22px;opacity:.92}
.pg{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 2px 12px #0003;isolation:isolate}
.pg .b{mix-blend-mode:multiply}
#ip{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9;gap:8px;padding:8px;border-radius:16px;background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 4px 18px #0003}
#cm{display:none;position:fixed;inset:0;z-index:20;background:#000d;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#cv{touch-action:none;max-width:100%}
.pg canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<div id="home">
  <div class="bar">
    <h1>StudyLove 💗</h1>
    <button onclick="fpdf.click()">📄 Abrir PDF</button>
    <button onclick="novo('a4')">📝 Folha A4</button>
    <button onclick="novo('inf')">♾️ Página infinita</button>
    <button onclick="backup()">💾 Backup</button>
    <button onclick="frest.click()">📥 Restaurar</button>
  </div>
  <div id="grid"></div>
</div>

<div id="ed">
  <button id="fab" title="Mostrar ferramentas">🎨</button>
  <div class="bar" id="tb">
    <button id="back">⬅️</button><button id="hd">🔼 Recolher</button><span id="ttl"></span><span id="pn"></span>
    <button data-t="pen" class="on">✏️</button>
    <button data-t="hl">🖍️</button><button id="sn" class="on" title="Marca-texto reto, alinhado à linha do texto">📏</button>
    <button data-t="erase">⚪</button>
    <button data-t="text">🔤</button>
    <button data-t="move">✋</button>
    <button id="img">🖼️</button>
    <span id="sws" style="display:flex;gap:6px"></span>
    <input type="color" id="cc" value="#d9648a">
    <input type="range" id="sz" min="1" max="12" value="3" style="width:90px">
    <button id="un">↩️</button><button id="re">↪️</button>
    <button id="zo">🔍−</button><button id="zi">🔍+</button>
    <button id="fg">👆 Dedo desenha</button>
    <button class="ob" id="ap">➕ Página</button>
    <button class="ob" id="bgb">🗒️ Fundo</button>
    <button id="ex">📤 PDF</button>
  </div>
  <div id="sc"></div>
</div>

<div id="ip"><button id="ic">✂️ Cortar</button><button id="ib">⬇️ Atrás do texto</button><button id="idl">🗑️</button><button id="ix">✖️</button></div>
<div id="cm"><canvas id="cv"></canvas><div style="display:flex;gap:10px"><button id="cok" class="on">✂️ Cortar</button><button id="cno">Cancelar</button></div></div>

<input type="file" id="fpdf" accept="application/pdf" hidden>
<input type="file" id="fimg" accept="image/*" hidden>
<input type="file" id="frest" accept="application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DPR=Math.min(devicePixelRatio||1,2),imgs=new Map();
let db,doc,pdf,io,st,tk=0,g=null;
const tp=new Map(); // dedos na tela (para a pinça)
let sel=null,snapHl=true,tool='pen',color='#d9648a',size=3,zoom=1.2,finger=false,undo=[],redo=[];
const sc=$('#sc');

/* ---------- Banco local (IndexedDB): PDFs e anotações ficam no aparelho ---------- */
const idb=(m,f)=>new Promise((ok,er)=>{const t=db.transaction('d',m),r=f(t.objectStore('d'));t.oncomplete=()=>ok(r.result);t.onerror=()=>er(t.error)});
const getAll=()=>idb('readonly',s=>s.getAll()),put=d=>idb('readwrite',s=>s.put(d)),del=id=>idb('readwrite',s=>s.delete(id));
const save=()=>{clearTimeout(st);st=setTimeout(()=>{doc.at=Date.now();put(doc)},400)};

/* ---------- PDF.js: o worker é carregado via blob para funcionar em qualquer hospedagem ---------- */
const WK='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const ready=(async()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await(await fetch(WK)).text()],{type:'text/javascript'}))}catch{pdfjsLib.GlobalWorkerOptions.workerSrc=WK}})();
const load=async buf=>{await ready;return pdfjsLib.getDocument({data:buf}).promise};

/* ---------- Início: biblioteca ---------- */
async function home(){
  $('#ed').style.display='none';$('#fab').style.display='none';$('#home').style.display='flex';
  const l=(await getAll()).sort((a,b)=>b.at-a.at),gr=$('#grid');
  gr.innerHTML=l.length?'':'<p>Nenhum caderno ainda. Abra um PDF de prova ou crie uma folha em branco. 💗</p>';
  l.forEach(d=>{
    const e=document.createElement('div');e.className='doc';
    e.innerHTML=`<div class="em">${d.kind=='pdf'?'📄':d.kind=='a4'?'📝':'♾️'}</div><b></b><small>${d.pages.length} pág. · ${new Date(d.at).toLocaleDateString('pt-BR')}</small><div style="margin-top:8px;display:flex;gap:6px"><button data-a="r">✏️</button><button data-a="d">🗑️</button></div>`;
    e.querySelector('b').textContent=d.name;
    e.onclick=async ev=>{
      const a=ev.target.dataset.a;
      if(a=='r'){const n=prompt('Novo nome',d.name);if(n){d.name=n;await put(d);home()}}
      else if(a=='d'){if(confirm('Excluir "'+d.name+'"?')){await del(d.id);home()}}
      else abrir(d)};
    gr.append(e)});
}
const pag=(w,h)=>({w,h,s:[],t:[],i:[]}); // s=traços, t=textos, i=imagens
async function novo(k){
  const n=prompt('Nome do caderno','Anotações');if(!n)return;
  const d={id:crypto.randomUUID(),name:n,kind:k,pdf:null,bg:'plain',pages:[k=='a4'?pag(595,842):pag(1000,1400)],at:Date.now()};
  await put(d);abrir(d);
}
$('#fpdf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const buf=await f.arrayBuffer(),P=await load(buf.slice(0)),pages=[];
  for(let i=1;i<=P.numPages;i++){const v=(await P.getPage(i)).getViewport({scale:1});pages.push(pag(v.width,v.height))}
  const d={id:crypto.randomUUID(),name:f.name.replace(/\.pdf$/i,''),kind:'pdf',pdf:new Blob([buf],{type:'application/pdf'}),bg:'plain',pages,at:Date.now()};
  await put(d);abrir(d);
};

/* ---------- Editor ---------- */
async function abrir(d){
  doc=d;undo=[];redo=[];
  pdf=d.pdf?await load(await d.pdf.arrayBuffer()):null;
  $('#home').style.display='none';$('#ed').style.display='flex';$('#ttl').textContent=d.name;
  $$('.ob').forEach(b=>b.style.display=d.kind=='pdf'?'none':'');
  let oc=false;try{oc=localStorage.getItem('sl_tb')=='1'}catch{}
  setTb(oc);
  zoom=Math.min(1.6,(innerWidth-30)/d.pages[0].w);build();
}
function build(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.done)draw(e.target)}),{root:sc,rootMargin:'700px'});
  sc.innerHTML='';
  doc.pages.forEach((p,n)=>{const d=document.createElement('div');d.className='pg';d.innerHTML='<canvas class="u"></canvas><canvas class="b"></canvas><canvas class="k"></canvas>';d.p=p;d.n=n;sizePg(d);sc.append(d);io.observe(d)});
}
function sizePg(d){
  const w=d.p.w*zoom,h=d.p.h*zoom;d.style.width=w+'px';d.style.height=h+'px';
  d.querySelectorAll('canvas').forEach(c=>{c.width=w*DPR;c.height=h*DPR});
}
function redoAll(){$$('.pg').forEach(d=>{sizePg(d);d.done=false;io.unobserve(d);io.observe(d)})}
function draw(d){ // desenha o fundo (PDF ou folha) e depois as anotações
  d.done=true;const t=d.tok=++tk;
  d.q=(d.q||Promise.resolve()).then(async()=>{
    if(t!=d.tok)return;
    const x=d.querySelector('.b').getContext('2d');
    if(pdf){
      const pg=await pdf.getPage(d.n+1);
      await pg.render({canvasContext:x,viewport:pg.getViewport({scale:zoom*DPR})}).promise;
      if(!d.lines){ // posição das linhas de texto do PDF, usada pelo marca-texto reto
        d.lines=[];
        try{const vp=pg.getViewport({scale:1});
          (await pg.getTextContent()).items.forEach(it=>{
            if(!it.str.trim())return;
            const m=pdfjsLib.Util.transform(vp.transform,it.transform),h=Math.hypot(m[2],m[3]),
              cy=m[5]-h*.3,x0=m[4],x1=m[4]+it.width,g=h*2;
            // junta pedaços do mesmo trecho de linha (mesma altura e próximos na horizontal)
            const l=d.lines.find(l=>Math.abs(l.cy-cy)<l.h*.5&&x0<=l.x1+g&&x1>=l.x0-g);
            if(l){l.x0=Math.min(l.x0,x0);l.x1=Math.max(l.x1,x1);l.h=Math.max(l.h,h*1.15)}
            else d.lines.push({cy,h:h*1.15,x0,x1})})}catch{}}
    }else bg(x,d.p,zoom*DPR);
    if(t==d.tok)ink(d);
  }).catch(()=>{});
}
function bg(x,p,k){ // linhas/quadriculado da folha em branco (o branco vem do fundo da página)
  if(!doc||doc.bg=='plain')return;
  x.strokeStyle='#e6d3dc';x.lineWidth=k;x.beginPath();
  for(let y=40;y<p.h;y+=28){x.moveTo(0,y*k);x.lineTo(p.w*k,y*k)}
  if(doc.bg=='grid')for(let a=28;a<p.w;a+=28){x.moveTo(a*k,0);x.lineTo(a*k,p.h*k)}
  x.stroke();
}
/* Camadas de cada página, de baixo para cima:
   u = imagens "atrás do texto" + marca-texto | b = PDF/folha (mistura multiply, o texto preto fica por cima) | k = o resto */
function inkU(d){const c=d.querySelector('.u'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);paintU(x,d.p,zoom*DPR)}
function ink(d){
  inkU(d);
  const c=d.querySelector('.k'),x=c.getContext('2d'),k=zoom*DPR;x.clearRect(0,0,c.width,c.height);paint(x,d.p,k);
  if(sel&&sel.d==d&&d.p.i.includes(sel.it)){ // contorno da imagem selecionada + alça de redimensionar
    const i=sel.it;x.save();x.setLineDash([8,5]);x.strokeStyle='#d9648a';x.lineWidth=2*DPR;x.strokeRect(i.x*k,i.y*k,i.w*k,i.h*k);
    x.setLineDash([]);x.fillStyle='#d9648a';x.beginPath();x.arc((i.x+i.w)*k,(i.y+i.h)*k,9*DPR,0,7);x.fill();x.restore()}
}
function getImg(s){let i=imgs.get(s);if(!i){i=new Image();i.src=s;i.addEventListener('load',()=>$$('.pg').forEach(d=>ink(d)));imgs.set(s,i)}return i}
function drawImg(x,i,k){const m=getImg(i.src);if(m.complete&&m.naturalWidth)x.drawImage(m,i.x*k,i.y*k,i.w*k,i.h*k)}
function paintU(x,p,k){p.i.forEach(i=>i.b&&drawImg(x,i,k));p.s.forEach(s=>s.t=='hl'&&stroke(x,s,k))}
function paint(x,p,k){
  p.i.forEach(i=>i.b||drawImg(x,i,k));
  p.s.forEach(s=>s.t!='hl'&&stroke(x,s,k));
  x.textBaseline='top';
  p.t.forEach(t=>{x.fillStyle=t.c;x.font=`${t.s*k}px Nunito,sans-serif`;t.t.split('\n').forEach((l,n)=>x.fillText(l,t.x*k,(t.y+n*t.s*1.25)*k))});
}
function stroke(x,s,k){
  x.strokeStyle=s.c;x.fillStyle=s.c;x.lineCap=x.lineJoin='round';
  if(s.t=='hl'){ // marca-texto: traço translúcido; s.h = altura da faixa quando alinhado à linha do texto
    if(s.bands){x.globalAlpha=.5;s.bands.forEach(b=>x.fillRect(b[0]*k,(b[2]-b[3]/2)*k,(b[1]-b[0])*k,b[3]*k));x.globalAlpha=1;return}
    x.globalAlpha=.5;x.lineCap='butt';x.lineWidth=(s.h||s.s*4)*k;x.beginPath();
    s.p.forEach((q,i)=>i?x.lineTo(q[0]*k,q[1]*k):x.moveTo(q[0]*k,q[1]*k));x.stroke();x.globalAlpha=1;return}
  if(s.p.length==1){x.beginPath();x.arc(s.p[0][0]*k,s.p[0][1]*k,s.s*k/2,0,7);x.fill();return}
  for(let i=1;i<s.p.length;i++){ // espessura varia com a pressão da caneta
    x.lineWidth=s.s*k*(.5+(s.p[i][2]||.5));x.beginPath();
    x.moveTo(s.p[i-1][0]*k,s.p[i-1][1]*k);x.lineTo(s.p[i][0]*k,s.p[i][1]*k);x.stroke()}
}

/* ---------- Gestos: caneta/mouse desenham; dedo rola a página (a menos que "Dedo desenha" esteja ligado) ---------- */
const pt=(d,e)=>{const r=d.getBoundingClientRect();return[(e.clientX-r.left)/zoom,(e.clientY-r.top)/zoom,e.pointerType=='pen'?e.pressure:.5]};
function snap(d){undo.push({n:d.n,j:JSON.stringify([d.p.s,d.p.t,d.p.i])});if(undo.length>60)undo.shift();redo=[]}
function swap(a,b){
  const o=a.pop();if(!o)return;const p=doc.pages[o.n];
  b.push({n:o.n,j:JSON.stringify([p.s,p.t,p.i])});[p.s,p.t,p.i]=JSON.parse(o.j);
  ink($$('.pg')[o.n]);save();
}
function hit(p,x,y){
  for(const i of [...p.i].reverse())if(x>=i.x&&x<=i.x+i.w&&y>=i.y&&y<=i.y+i.h)return i;
  for(const t of [...p.t].reverse()){const L=t.t.split('\n');
    if(x>=t.x&&x<=t.x+Math.max(...L.map(l=>l.length))*t.s*.55&&y>=t.y&&y<=t.y+L.length*t.s*1.25)return t}
}
function segAt(d,x,y){ // trecho de linha de texto sob o ponto tocado
  let b=null,m=1e9;
  (d.lines||[]).forEach(l=>{const q=Math.abs(l.cy-y);if(q<m&&q<=l.h*.8&&x>=l.x0-l.h*2&&x<=l.x1+l.h*2){m=q;b=l}});
  return b}
function bands(d,A,xs,x,y){ // faixas do marca-texto entre o ponto inicial (xs) e o ponto atual, como uma seleção de texto
  const col=d.lines.filter(l=>l.x0<A.x1&&l.x1>A.x0).sort((a,b)=>a.cy-b.cy); // linhas da mesma coluna
  let B=A,m=1e9;col.forEach(l=>{const q=Math.abs(l.cy-y);if(q<m){m=q;B=l}});
  const ia=col.indexOf(A),ib=col.indexOf(B),dn=ib>=ia,o=[];
  if(ia==ib)return[[Math.min(xs,x),Math.max(xs,x),A.cy,A.h]];
  for(let i=Math.min(ia,ib);i<=Math.max(ia,ib);i++){
    const l=col[i];let p=l.x0,q=l.x1;
    if(i==ia){if(dn)p=xs;else q=xs}
    if(i==ib){if(dn)q=x;else p=x}
    o.push([Math.min(p,q),Math.max(p,q),l.cy,l.h])}
  return o}
function select(d,it){
  const o=sel;sel=it?{d,it}:null;
  $('#ip').style.display=it?'flex':'none';
  if(it)$('#ib').textContent=it.b?'⬆️ Na frente do texto':'⬇️ Atrás do texto';
  if(o&&o.d!=d)ink(o.d);
  if(d)ink(d);
}
function erase(d,x,y){
  const p=d.p,n=p.s.length;
  p.s=p.s.filter(s=>!(s.bands?s.bands.some(b=>x>=b[0]-4&&x<=b[1]+4&&Math.abs(y-b[2])<b[3]/2+4)
    :s.sn?(Math.abs(y-s.p[0][1])<s.h/2+4&&x>=Math.min(s.p[0][0],s.p[1][0])-6&&x<=Math.max(s.p[0][0],s.p[1][0])+6)
    :s.p.some(q=>Math.hypot(q[0]-x,q[1]-y)<12)));
  const h=hit(p,x,y);
  if(h){p.t=p.t.filter(t=>t!=h);p.i=p.i.filter(i=>i!=h)}
  if(h||p.s.length!=n)ink(d);
}
function addText(d,x,y){
  const fs=14+size*2,a=document.createElement('textarea');
  Object.assign(a.style,{position:'absolute',left:x*zoom+'px',top:y*zoom+'px',font:`${fs*zoom}px Nunito,sans-serif`,color,minWidth:'150px',border:'1px dashed #d9648a',background:'#fff9',zIndex:5});
  d.append(a);setTimeout(()=>a.focus(),0);
  a.onblur=()=>{const v=a.value.trim();a.remove();if(v){snap(d);d.p.t.push({x,y,t:v,c:color,s:fs});ink(d);save()}};
}
sc.onpointerdown=e=>{
  if(e.target.tagName=='TEXTAREA')return;
  const d=e.target.closest('.pg');
  if(!d||(e.pointerType=='touch'&&!finger)){
    sc.setPointerCapture(e.pointerId);tp.set(e.pointerId,[e.clientX,e.clientY]);
    if(tp.size==2){const[a,b]=[...tp.values()];g={pinch:1,dist:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z0:zoom,z:zoom}} // dois dedos = zoom
    else g={pan:1,x:e.clientX,y:e.clientY};
    return}
  const[x,y,pr]=pt(d,e),p=d.p;
  if(tool=='text'){e.preventDefault();addText(d,x,y);return}
  sc.setPointerCapture(e.pointerId);
  if(tool=='pen'||tool=='hl'){
    snap(d);const s={t:tool,c:color,s:size,p:[[x,y,pr]]};
    let A=null;
    if(tool=='hl'&&snapHl){ // reto: gruda nas linhas do texto; arrastar para baixo/cima cobre várias linhas
      A=segAt(d,x,y);
      if(A)s.bands=[[x,x,A.cy,A.h]];
      else{s.h=size*4+8;s.p=[[x,y,.5],[x,y,.5]];s.sn=1} // PDF sem texto (imagem): faixa reta de uma linha
    }
    p.s.push(s);g={d,s,A,xs:x};
    if(tool=='hl')inkU(d);else stroke(d.querySelector('.k').getContext('2d'),s,zoom*DPR);
  }else if(tool=='erase'){snap(d);g={d,er:1};erase(d,x,y)}
  else if(tool=='move'){
    let it=null,rs=0;
    if(sel&&sel.d==d&&p.i.includes(sel.it)){const q=sel.it; // alça no canto inferior direito = redimensionar
      if(Math.abs(x-q.x-q.w)<24/zoom&&Math.abs(y-q.y-q.h)<24/zoom){it=q;rs=1}}
    it=it||hit(p,x,y);
    if(it){snap(d);g={d,it,rs,ox:x-it.x,oy:y-it.y,mv:0}}else select(d,null);
  }
};
sc.onpointermove=e=>{
  if(tp.has(e.pointerId))tp.set(e.pointerId,[e.clientX,e.clientY]);
  if(!g)return;
  if(g.pinch){ // pré-visualização rápida (esticando o bitmap); a página é redesenhada nítida ao soltar
    if(tp.size<2)return;
    const[a,b]=[...tp.values()],z=Math.max(.5,Math.min(3,g.z0*Math.hypot(a[0]-b[0],a[1]-b[1])/g.dist)),
      r=sc.getBoundingClientRect(),cx=(a[0]+b[0])/2-r.left,cy=(a[1]+b[1])/2-r.top,f=z/g.z;
    $$('.pg').forEach(d=>{d.style.width=d.p.w*z+'px';d.style.height=d.p.h*z+'px'});
    sc.scrollLeft=(sc.scrollLeft+cx)*f-cx;sc.scrollTop=(sc.scrollTop+cy)*f-cy;g.z=z;return}
  if(g.pan){sc.scrollLeft-=e.clientX-g.x;sc.scrollTop-=e.clientY-g.y;g.x=e.clientX;g.y=e.clientY;return}
  const[x,y,pr]=pt(g.d,e),p=g.d.p;
  if(g.s){
    if(g.A)g.s.bands=bands(g.d,g.A,g.xs,x,y);else if(g.s.sn)g.s.p[1]=[x,g.s.p[0][1],.5];else g.s.p.push([x,y,pr]);
    if(g.s.t=='hl')inkU(g.d);else stroke(g.d.querySelector('.k').getContext('2d'),{...g.s,p:g.s.p.slice(-2)},zoom*DPR);
    if(doc.kind=='inf'&&y>p.h-300){p.h+=800;sizePg(g.d);g.d.done=false;draw(g.d)} // página infinita: cresce ao chegar no fim
  }else if(g.er)erase(g.d,x,y);
  else if(g.it){
    g.mv=1;
    if(g.rs){const w=Math.max(30,x-g.it.x);g.it.h*=w/g.it.w;g.it.w=w}else{g.it.x=x-g.ox;g.it.y=y-g.oy}
    ink(g.d)}
};
sc.onpointerup=sc.onpointercancel=e=>{
  tp.delete(e.pointerId);
  if(g&&g.pinch){zoom=g.z;g=null;redoAll();return}
  if(g&&g.it&&!g.mv){undo.pop();if(g.d.p.i.includes(g.it))select(g.d,g.it)} // toque sem arrastar
  if(g&&!g.pan)save();g=null};
sc.onscroll=()=>{const r=sc.getBoundingClientRect(),cy=r.top+r.height/2,d=$$('.pg').find(d=>{const b=d.getBoundingClientRect();return b.top<=cy&&b.bottom>=cy});if(d)$('#pn').textContent=`${d.n+1}/${doc.pages.length}`};

/* ---------- Barra de ferramentas ---------- */
$$('[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;if(sel)select(sel.d,null);$$('[data-t]').forEach(x=>x.classList.toggle('on',x==b))});
['#3b2733','#d9648a','#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e5ce6'].forEach(c=>{
  const b=document.createElement('button');b.className='sw';b.style.background=c;
  b.onclick=()=>{color=c;$('#cc').value=c;$$('.sw').forEach(x=>x.classList.toggle('on',x==b))};$('#sws').append(b)});
$('#cc').oninput=e=>{color=e.target.value;$$('.sw').forEach(x=>x.classList.remove('on'))};
$('#sz').oninput=e=>size=+e.target.value;
function setTb(oculta){ // recolhe a barra e mostra um botão flutuante 🎨 para reabri-la
  $('#tb').style.display=oculta?'none':'flex';
  $('#fab').style.display=oculta?'block':'none';
  try{localStorage.setItem('sl_tb',oculta?'1':'0')}catch{}
}
$('#hd').onclick=()=>setTb(true);
$('#fab').onclick=()=>setTb(false);
$('#sn').onclick=e=>{snapHl=!snapHl;e.currentTarget.classList.toggle('on',snapHl)};
/* painel da imagem selecionada */
$('#ix').onclick=()=>select(sel.d,null);
$('#idl').onclick=()=>{const{d,it}=sel;snap(d);d.p.i=d.p.i.filter(i=>i!=it);select(d,null);save()};
$('#ib').onclick=()=>{const{d,it}=sel;snap(d);it.b=it.b?0:1;select(d,it);save()}; // atrás/na frente do texto
$('#ic').onclick=()=>{ // recorte retangular: arraste sobre a imagem para escolher a área
  const{d,it}=sel,m=getImg(it.src),W=m.naturalWidth,H=m.naturalHeight,cv=$('#cv'),
    f=Math.min((innerWidth-40)/W,(innerHeight-140)/H);
  cv.width=W*f;cv.height=H*f;
  let r=[0,0,cv.width,cv.height],a=null;
  const show=()=>{const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);x.drawImage(m,0,0,cv.width,cv.height);
    x.fillStyle='#0009';x.fillRect(0,0,cv.width,r[1]);x.fillRect(0,r[1]+r[3],cv.width,cv.height);
    x.fillRect(0,r[1],r[0],r[3]);x.fillRect(r[0]+r[2],r[1],cv.width,r[3]);
    x.strokeStyle='#fff';x.lineWidth=2;x.setLineDash([8,5]);x.strokeRect(...r)};
  const pos=e=>{const b=cv.getBoundingClientRect();
    return[Math.max(0,Math.min(cv.width,(e.clientX-b.left)*cv.width/b.width)),Math.max(0,Math.min(cv.height,(e.clientY-b.top)*cv.height/b.height))]};
  cv.onpointerdown=e=>{a=pos(e);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!a)return;const b=pos(e);r=[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1])];show()};
  cv.onpointerup=()=>a=null;
  $('#cno').onclick=()=>$('#cm').style.display='none';
  $('#cok').onclick=()=>{
    if(r[2]<10||r[3]<10)return;
    const sx=r[0]/f,sy=r[1]/f,sw=r[2]/f,sh=r[3]/f,c=document.createElement('canvas');
    c.width=sw;c.height=sh;c.getContext('2d').drawImage(m,sx,sy,sw,sh,0,0,sw,sh);
    snap(d);it.x+=it.w*sx/W;it.y+=it.h*sy/H;it.w*=sw/W;it.h*=sh/H; // mantém a imagem no mesmo lugar e escala
    it.src=c.toDataURL('image/jpeg',.9);
    $('#cm').style.display='none';ink(d);save()};
  show();$('#cm').style.display='flex';
};
$('#un').onclick=()=>swap(undo,redo);$('#re').onclick=()=>swap(redo,undo);
$('#zo').onclick=()=>{zoom=Math.max(.5,zoom-.2);redoAll()};
$('#zi').onclick=()=>{zoom=Math.min(3,zoom+.2);redoAll()};
$('#fg').onclick=e=>{finger=!finger;e.target.classList.toggle('on',finger)};
$('#back').onclick=async()=>{clearTimeout(st);doc.at=Date.now();await put(doc);home()};
$('#ap').onclick=()=>{doc.pages.push(pag(595,842));build();save();sc.scrollTop=sc.scrollHeight};
$('#bgb').onclick=()=>{doc.bg={plain:'lines',lines:'grid',grid:'plain'}[doc.bg];redoAll();save()};
$('#img').onclick=()=>$('#fimg').click();
$('#fimg').onchange=e=>{ // insere imagem/print na página que está no centro da tela
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{
    const k=Math.min(1,1000/m.width),c=document.createElement('canvas');c.width=m.width*k;c.height=m.height*k;
    c.getContext('2d').drawImage(m,0,0,c.width,c.height);
    const b=sc.getBoundingClientRect(),cy=b.top+b.height/3,d=$$('.pg').find(d=>{const q=d.getBoundingClientRect();return q.top<=cy&&q.bottom>=cy})||sc.firstChild;
    const w=Math.min(300,d.p.w-80),y=Math.max(20,(cy-d.getBoundingClientRect().top)/zoom);
    snap(d);d.p.i.push({src:c.toDataURL('image/jpeg',.85),x:40,y,w,h:w*c.height/c.width});
    save();$('[data-t=move]').click();select(d,d.p.i[d.p.i.length-1])};m.src=r.result};r.readAsDataURL(f);
};

/* ---------- Exportar PDF anotado (cada página vira imagem com as anotações) ---------- */
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)};
$('#ex').onclick=async e=>{
  const b=e.target;b.textContent='⏳ Gerando...';
  try{
    const out=await PDFLib.PDFDocument.create(),k=2;
    for(const[n,p]of doc.pages.entries()){
      const c=document.createElement('canvas');c.width=p.w*k;c.height=p.h*k;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      await Promise.all(p.i.map(i=>{const m=getImg(i.src);return m.complete&&m.naturalWidth?0:new Promise(r=>m.addEventListener('load',r))}));
      paintU(x,p,k); // imagens atrás do texto e marca-texto
      const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height; // página/PDF misturada em multiply
      if(pdf){const pg=await pdf.getPage(n+1);await pg.render({canvasContext:c2.getContext('2d'),viewport:pg.getViewport({scale:k})}).promise}else bg(c2.getContext('2d'),p,k);
      x.globalCompositeOperation='multiply';x.drawImage(c2,0,0);x.globalCompositeOperation='source-over';
      paint(x,p,k);
      const jpg=await out.embedJpg(await(await new Promise(r=>c.toBlob(r,'image/jpeg',.9))).arrayBuffer());
      out.addPage([p.w,p.h]).drawImage(jpg,{x:0,y:0,width:p.w,height:p.h});
    }
    dl(new Blob([await out.save()],{type:'application/pdf'}),doc.name+' (anotado).pdf');
  }catch(err){alert('Não foi possível exportar: '+err.message)}
  b.textContent='📤 PDF';
};

/* ---------- Backup e restauração (um único arquivo .json) ---------- */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function backup(){
  const all=await Promise.all((await getAll()).map(async d=>({...d,pdf:d.pdf?await b64(d.pdf):null})));
  dl(new Blob([JSON.stringify({v:1,docs:all})],{type:'application/json'}),'studylove-backup-'+new Date().toISOString().slice(0,10)+'.json');
}
$('#frest').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());
    for(const d of j.docs){if(d.pdf)d.pdf=await(await fetch(d.pdf)).blob();await put(d)}
    alert(j.docs.length+' caderno(s) restaurado(s)! 💗');home()}
  catch{alert('Arquivo de backup inválido.')}
};

/* ---------- Início ---------- */
const rq=indexedDB.open('studylove',1);
rq.onupgradeneeded=()=>rq.result.createObjectStore('d',{keyPath:'id'});
rq.onsuccess=()=>{db=rq.result;home()};

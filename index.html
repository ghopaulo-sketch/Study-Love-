.doc{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.doc .em{font-size:34px}.doc b{display:block;word-break:break-word}.doc small{opacity:.7}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid #fff}
.sw.on{outline:3px solid var(--pink)}
#ttl{font-weight:800;max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sc{flex:1;overflow:auto;background:#e4d3da;padding:14px;touch-action:none}
#fab{display:none;position:fixed;top:10px;right:10px;z-index:9;width:48px;height:48px;padding:0;border-radius:50%;background:var(--pink);color:#fff;font-size:22px;opacity:.92}
.pg{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 2px 12px #0003;isolation:isolate}
.pg .b{mix-blend-mode:multiply}
#ip{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9;gap:8px;padding:8px;border-radius:16px;background:var(--glass);backdrop-filter:blur(12px);box-shadow:0 4px 18px #0003}
#cm{display:none;position:fixed;inset:0;z-index:20;background:#000d;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#cv{touch-action:none;max-width:100%}
#fo{font:inherit;border-radius:12px;border:0;padding:8px;max-width:130px;box-shadow:0 1px 4px #0002}

.sw2{width:32px;height:32px;padding:0;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px #0003}
#tcc{width:44px;height:34px;border:0;padding:0;background:none}
#pm{max-height:72vh;overflow:auto}.pr{display:flex;align-items:center;gap:6px}.pr span{flex:1;font-weight:700;min-width:140px;padding-right:8px}
/* ----- painel de páginas (miniaturas / marcadores) e rolagem rápida ----- */
#scw{flex:1;min-height:0;display:flex;position:relative}
#sc{flex:1;min-width:0}
#side{display:none;width:156px;flex:none;flex-direction:column;gap:10px;overflow:auto;padding:10px 10px 24px;background:#2a2230;color:#fff}

#sdl{display:flex;flex-direction:column;gap:14px}
#sdl>button{font-size:13px}
.ti{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:#e9d8e4;font-size:12px;text-align:center;position:relative}
.ti canvas{width:100%;min-height:60px;background:#3b3044;border-radius:6px;box-shadow:0 2px 8px #0009;outline:3px solid transparent}
.ti.on canvas{outline-color:#ec7aa1}.ti.on span{color:#ffb3cf;font-weight:800}

#sbar{position:absolute;right:8px;top:10px;bottom:10px;width:40px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;touch-action:none}

.pg canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
</style>

const DPR=Math.min(devicePixelRatio||1,2),imgs=new Map();

const tp=new Map(); // dedos na tela (para a pinça)
let sel=null,snapHl=true,tool='pen',color='#d9648a',size=3,zoom=1.2,finger=false,undo=[],redo=[];
const sc=$('#sc');
const FONTS=[['Nunito','Padrão','Escola'],['Comfortaa','Comfortaa','Escola'],['Fredoka','Fredoka','Escola'],
 ['Patrick Hand','Caderno','Manuscritas'],['Caveat','Manuscrita','Manuscritas'],['Kalam','Kalam','Manuscritas'],['Indie Flower','Indie Flower','Manuscritas'],['Shadows Into Light','Shadows Into Light','Manuscritas'],['Gloria Hallelujah','Gloria Hallelujah','Manuscritas'],['Handlee','Handlee','Manuscritas'],['Architects Daughter','Architects Daughter','Manuscritas'],

/* ---------- PDF.js: o worker é carregado via blob para funcionar em qualquer hospedagem ---------- */
const WK='libs/pdf.worker.min.js';
const ready=(async()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await(await fetch(WK)).text()],{type:'text/javascript'}))}catch{pdfjsLib.GlobalWorkerOptions.workerSrc=WK}})();
const load=async buf=>{await ready;return pdfjsLib.getDocument({data:buf}).promise};

/* ---------- Início: biblioteca ---------- */
async function home(){
  await fontsReady;
  $('#ed').style.display='none';$('#fab').style.display='none';$('#home').style.display='flex';
  const l=(await getAll()).sort((a,b)=>b.at-a.at),gr=$('#grid');
  gr.innerHTML=l.length?'':'<p>Nenhum caderno ainda. Abra um PDF de prova ou crie uma folha em branco. 💗</p>';
  l.forEach(d=>{
    const e=document.createElement('div');e.className='doc';
    const cv=d.pages[0]&&d.pages[0].cover;
    e.innerHTML=`${cv?'<canvas class="th" width="300" height="424"></canvas>':`<div class="em">${d.kind=='pdf'?'📄':d.kind=='a4'?'📝':'♾️'}</div>`}<b></b><small>${d.pages.length} pág. · ${new Date(d.at).toLocaleDateString('pt-BR')}</small><div style="margin-top:8px;display:flex;gap:6px"><button data-a="r">✏️</button><button data-a="d">🗑️</button></div>`;
    e.querySelector('b').textContent=d.name;
    if(cv){const c=e.querySelector('.th'),pt=()=>paintCover(c.getContext('2d'),d.pages[0],300/595);pt();
      if(cv.img){const m=getImg(cv.img);if(!m.complete)m.addEventListener('load',pt)}}
    e.onclick=async ev=>{
      const a=ev.target.dataset.a;
      if(a=='r'){const n=prompt('Novo nome',d.name);if(n){d.name=n;await put(d);home()}}
      else if(a=='d'){if(confirm('Excluir "'+d.name+'"?')){await del(d.id);home()}}
      else abrir(d)};
    gr.append(e)});
}
const pag=(w,h,o)=>({w,h,s:[],t:[],i:[],...o}); // s=traços, t=textos, i=imagens
async function novo(k){
  const n=prompt('Nome do caderno','Anotações');if(!n)return;
  const cover={t:n,s:'',th:(await getAll()).length%TEMAS.length,f:'Pacifico'}; // todo caderno novo já nasce com capa
  const d={id:crypto.randomUUID(),name:n,kind:k,pdf:null,bg:'plain',pages:[pag(595,842,{cover}),k=='a4'?pag(595,842):pag(1000,1400,{inf:1})],at:Date.now()};
  await put(d);abrir(d);
}
$('#fpdf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const buf=await f.arrayBuffer(),P=await load(buf.slice(0)),pages=[];
  for(let i=1;i<=P.numPages;i++){const v=(await P.getPage(i)).getViewport({scale:1});pages.push(pag(v.width,v.height,{pi:i-1}))}
  const d={id:crypto.randomUUID(),name:f.name.replace(/\.pdf$/i,''),kind:'pdf',pdf:new Blob([buf],{type:'application/pdf'}),bg:'plain',pages,at:Date.now()};
  await put(d);abrir(d);
};

/* ---------- Editor ---------- */
async function abrir(d){
  doc=d;undo=[];redo=[];
  // compatibilidade com cadernos antigos: cada página aprende de onde vem (página do PDF ou folha em branco)
  if(d.kind=='pdf')d.pages.forEach((p,i)=>{if(p.pi===undefined&&!p.blank&&!p.cover)p.pi=i});
  if(d.kind=='inf')d.pages.forEach(p=>{if(!p.cover&&!p.blank&&p.inf===undefined)p.inf=1});
  pdf=d.pdf?await load(await d.pdf.arrayBuffer()):null;
  $('#side').style.display='none';$('#sd').classList.remove('on');
  $('#home').style.display='none';$('#ed').style.display='flex';$('#ttl').textContent=d.name;
  let oc=false;try{oc=localStorage.getItem('sl_tb')=='1'}catch{}
  setTb(oc);
  zoom=Math.min(1.6,(innerWidth-30)/d.pages[0].w);build();
}
function build(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target.done)draw(e.target)}),{root:sc,rootMargin:'700px'});
  sc.innerHTML='';
  doc.pages.forEach((p,n)=>{const d=document.createElement('div');d.className='pg';d.innerHTML='<canvas class="u"></canvas><canvas class="b"></canvas><canvas class="k"></canvas>';d.p=p;d.n=n;sizePg(d);sc.append(d);io.observe(d)});
  if($('#side').style.display=='flex')sdBuild();setTimeout(()=>{sbUpdate();sc.onscroll()},0);
}
function sizePg(d){
  const w=d.p.w*zoom,h=d.p.h*zoom;d.style.width=w+'px';d.style.height=h+'px';
  d.querySelectorAll('canvas').forEach(c=>{c.width=w*DPR;c.height=h*DPR});
}
function redoAll(){$$('.pg').forEach(d=>{sizePg(d);d.done=false;io.unobserve(d);io.observe(d)})}
function draw(d){ // desenha o fundo (PDF ou folha) e depois as anotações
  d.done=true;const t=d.tok=++tk;
  d.q=(d.q||Promise.resolve()).then(async()=>{
    if(t!=d.tok)return;
    d.style.background=pageColor(d.p); // página escura: sem mistura multiply
    d.querySelector('.b').style.mixBlendMode=pageColor(d.p)=='#fff'?'':'normal';
    const x=d.querySelector('.b').getContext('2d');
    if(d.p.cover)paintCover(x,d.p,zoom*DPR);
    else if(pdf&&d.p.pi!==undefined){
      const pg=await pdf.getPage(d.p.pi+1);
      await pg.render({canvasContext:x,viewport:pg.getViewport({scale:zoom*DPR})}).promise;
      if(!d.lines){ // posição das linhas de texto do PDF, usada pelo marca-texto reto
        d.lines=[];
        try{const vp=pg.getViewport({scale:1});
          (await pg.getTextContent()).items.forEach(it=>{
            if(!it.str.trim())return;
            const m=pdfjsLib.Util.transform(vp.transform,it.transform),h=Math.hypot(m[2],m[3]),
              cy=m[5]-h*.3,x0=m[4],x1=m[4]+it.width,g=h*2;
            // junta pedaços do mesmo trecho de linha (mesma altura e próximos na horizontal)
            const l=d.lines.find(l=>Math.abs(l.cy-cy)<l.h*.5&&x0<=l.x1+g&&x1>=l.x0-g);
            if(l){l.x0=Math.min(l.x0,x0);l.x1=Math.max(l.x1,x1);l.h=Math.max(l.h,h*1.15)}
            else d.lines.push({cy,h:h*1.15,x0,x1})})}catch{}}
    }else bg(x,d.p,zoom*DPR);
    if(t==d.tok)ink(d);
  }).catch(()=>{});
}
function bgInfo(p){let t=p.bg||(doc&&doc.bg)||'plain';if(t=='dark')t='dotted-d';const d=t.slice(-2)=='-d';return{t:d?t.slice(0,-2):t,d}}
const pageColor=p=>bgInfo(p).d?'#1f1b26':'#fff';
function bg(x,p,k){ // fundos das folhas em branco (versão clara e escura de cada modelo)
  const{t,d}=bgInfo(p),ln=d?'#ffffff24':'#e6d3dc',dv=d?'#8a7a9c':'#d3aebd',W=p.w,H=p.h;
  const L=(a,b,c,e,col,w)=>{x.strokeStyle=col;x.lineWidth=w*k;x.beginPath();x.moveTo(a*k,b*k);x.lineTo(c*k,e*k);x.stroke()};
  const rows=(y0,st)=>{for(let y=y0;y<H;y+=st)L(0,y,W,y,ln,1)};
  if(t=='dotted'){x.fillStyle=d?'#ffffff40':'#c9a9b8';
    for(let yy=28;yy<H;yy+=28)for(let xx=28;xx<W;xx+=28){x.beginPath();x.arc(xx*k,yy*k,1.5*k,0,7);x.fill()}}
  if(t=='lines'||t=='splitlines'||t=='margin'||t=='grid')rows(40,28);
  if(t=='grid')for(let a=28;a<W;a+=28)L(a,0,a,H,ln,1);
  if(t=='split'||t=='splitlines')L(W/2,18,W/2,H-18,dv,2);
  if(t=='margin')L(62,0,62,H,d?'#c06a8a':'#f0a0b8',1.5);
  if(t=='cornell'){L(0,70,W,70,dv,2);L(W*.3,70,W*.3,H*.82,dv,2);L(0,H*.82,W,H*.82,dv,2)}
  if(t=='cols3'){L(W/3,18,W/3,H-18,dv,2);L(W*2/3,18,W*2/3,H-18,dv,2)}
  if(t=='todo')for(let y=50;y<H-20;y+=34){L(54,y,W-30,y,ln,1);x.strokeStyle=dv;x.lineWidth=1.5*k;x.strokeRect(26*k,(y-21)*k,18*k,18*k)}
}
/* ---------- Capa ---------- */
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function heart(x,a,b,r){x.beginPath();x.moveTo(a,b+r);x.bezierCurveTo(a+r*1.6,b-r*.2,a+r*.7,b-r*1.3,a,b-r*.4);x.bezierCurveTo(a-r*.7,b-r*1.3,a-r*1.6,b-r*.2,a,b+r);x.fill()}
function star(x,a,b,r){x.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.45:r,t=Math.PI/5*i-Math.PI/2;x.lineTo(a+q*Math.cos(t),b+q*Math.sin(t))}x.closePath();x.fill()}
function wrap(x,t,w){const o=[];let l='';t.split(/\s+/).forEach(p=>{const q=l?l+' '+p:p;if(x.measureText(q).width>w&&l){o.push(l);l=p}else l=q});if(l)o.push(l);return o}
function paintCover(x,p,k){ // k = pixels por unidade da página
  const c=p.cover,W=p.w*k,H=p.h*k,T=TEMAS[c.th%TEMAS.length],g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,T[0]);g.addColorStop(1,T[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  const m=c.img&&getImg(c.img);
  if(m&&m.complete&&m.naturalWidth){const r=Math.max(W/m.naturalWidth,H/m.naturalHeight),w=m.naturalWidth*r,h=m.naturalHeight*r;x.drawImage(m,(W-w)/2,(H-h)/2,w,h)}
  else{ // padrão decorativo do tema
    x.fillStyle='#ffffff70';const s=64*k;
    for(let j=0;j*s<H+s;j++)for(let i=0;i*s<W+s;i++){const cx=(i+(j%2?.5:0))*s,cy=j*s;
      if(T[2]=='dots'){x.beginPath();x.arc(cx,cy,9*k,0,7);x.fill()}
      else if(T[2]=='hearts')heart(x,cx,cy,12*k);else if(T[2]=='stars')star(x,cx,cy,13*k);
      else if(T[2]=='flowers')flor(x,cx,cy,15*k,'#ffffff70','#ffffff90');
      else if(T[2]=='diamonds'){x.beginPath();x.moveTo(cx,cy-13*k);x.lineTo(cx+9*k,cy);x.lineTo(cx,cy+13*k);x.lineTo(cx-9*k,cy);x.closePath();x.fill()}
      else if(T[2]=='check'&&(i+j)%2==0)x.fillRect(i*s,j*s,s,s);
      else if(T[2]=='stripes'&&i==0)x.fillRect(0,j*s,W,s/2)}}
  const bx=W*.1,bw=W*.8,by=H*.3,bh=H*.28;
  if(!c.nl){ // etiqueta branca (pode ser desligada no editor de capa)
    x.fillStyle='#ffffffeb';rr(x,bx,by,bw,bh,28*k);x.fill();
    x.strokeStyle=T[1];x.lineWidth=3*k;x.setLineDash([10*k,7*k]);rr(x,bx+10*k,by+10*k,bw-20*k,bh-20*k,20*k);x.stroke();x.setLineDash([]);}
  if(c.nt)return; // capa sem nenhum texto
  x.textAlign='center';x.textBaseline='middle';x.fillStyle='#3b2733';
  const f=c.f||'Pacifico';let fs=46*k,L;
  for(;;){x.font=`${fs}px "${f}",sans-serif`;L=wrap(x,c.t||'',bw-60*k);if((L.length<=3&&L.length*fs*1.2<=bh*(c.s?.5:.7))||fs<=16*k)break;fs-=3*k}
  const mid=by+bh*(c.s?.4:.5);
  L.forEach((l,i)=>{const yy=mid+(i-(L.length-1)/2)*fs*1.2;
    if(c.nl){x.lineJoin='round';x.lineWidth=fs*.2;x.strokeStyle='#fff';x.strokeText(l,W/2,yy)} // contorno branco para ler sem etiqueta
    x.fillText(l,W/2,yy)});
  if(c.s){x.font=`${22*k}px Nunito,sans-serif`;x.fillStyle=c.nl?'#3b2733':'#7a5b69';
    if(c.nl){x.lineJoin='round';x.lineWidth=5*k;x.strokeStyle='#fff';x.strokeText(c.s,W/2,by+bh*.82)}
    x.fillText(c.s,W/2,by+bh*.82)}
  x.textAlign='start';x.textBaseline='alphabetic';
}
let kd=null; // rascunho da capa em edição
function prevCapa(){const c=$('#kv'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);paintCover(x,{w:595,h:842,cover:kd},c.width/595);
  $$('#kth button').forEach((b,i)=>b.classList.toggle('on',i==kd.th&&!kd.img))}
function abrirCapa(){
  const ex=doc.pages[0]&&doc.pages[0].cover;
  kd=ex?{...ex}:{t:doc.name,s:'',th:0,f:'Pacifico'};
  $('#knl').checked=!!kd.nl;$('#knt').checked=!!kd.nt;$('#kt').value=kd.t;$('#ks').value=kd.s||'';$('#kf').value=kd.f||'Pacifico';
  $('#kdl').style.display=ex&&doc.pages.length>1?'':'none';
  prevCapa();$('#km').style.display='flex';
}

/* Camadas de cada página, de baixo para cima:
   u = imagens "atrás do texto" + marca-texto | b = PDF/folha (mistura multiply, o texto preto fica por cima) | k = o resto */
function inkU(d){const c=d.querySelector('.u'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);paintU(x,d.p,zoom*DPR)}
function ink(d){
  inkU(d);
  const c=d.querySelector('.k'),x=c.getContext('2d'),k=zoom*DPR;x.clearRect(0,0,c.width,c.height);paint(x,d.p,k);
  if(sel&&sel.d==d&&(d.p.i.includes(sel.it)||d.p.t.includes(sel.it))){ // contorno do item selecionado (+ alça de redimensionar nas imagens)
    const i=sel.it,im=!!i.src,[w,h]=im?[i.w,i.h]:tbox(i);x.save();x.setLineDash([8,5]);x.strokeStyle='#d9648a';x.lineWidth=2*DPR;x.strokeRect((i.x-3)*k,(i.y-3)*k,(w+6)*k,(h+6)*k);
    x.setLineDash([]);x.fillStyle='#d9648a';x.beginPath();x.arc((i.x+w)*k,(i.y+h)*k,9*DPR,0,7);x.fill();x.restore()}
}
function getImg(s){let i=imgs.get(s);if(!i){i=new Image();i.src=s;i.addEventListener('load',()=>$$('.pg').forEach(d=>ink(d)));imgs.set(s,i)}return i}
function drawImg(x,i,k){const m=getImg(i.src);if(m.complete&&m.naturalWidth)x.drawImage(m,i.x*k,i.y*k,i.w*k,i.h*k)}
function paintU(x,p,k){p.i.forEach(i=>i.b&&drawImg(x,i,k));p.s.forEach(s=>s.t=='hl'&&stroke(x,s,k))}
function paint(x,p,k){
  p.i.forEach(i=>i.b||drawImg(x,i,k));
  p.s.forEach(s=>s.t!='hl'&&stroke(x,s,k));
  x.textBaseline='top';
  p.t.forEach(t=>{x.fillStyle=t.c;x.font=`${t.s*k}px "${t.f||'Nunito'}",sans-serif`;t.t.split('\n').forEach((l,n)=>x.fillText(l,t.x*k,(t.y+n*t.s*1.25)*k))});
}
function stroke(x,s,k){
  x.strokeStyle=s.c;x.fillStyle=s.c;x.lineCap=x.lineJoin='round';
  if(s.t=='hl'){ // marca-texto: traço translúcido; s.h = altura da faixa quando alinhado à linha do texto
    if(s.bands){x.globalAlpha=.5;s.bands.forEach(b=>{rr(x,(b[0]-3)*k,(b[2]-b[3]/2)*k,(b[1]-b[0]+6)*k,b[3]*k,b[3]*k/2);x.fill()});x.globalAlpha=1;return}
    x.globalAlpha=.5;x.lineCap='butt';x.lineWidth=(s.h||s.s*4)*k;x.beginPath();
    s.p.forEach((q,i)=>i?x.lineTo(q[0]*k,q[1]*k):x.moveTo(q[0]*k,q[1]*k));x.stroke();x.globalAlpha=1;return}
  if(s.p.length==1){x.beginPath();x.arc(s.p[0][0]*k,s.p[0][1]*k,s.s*k/2,0,7);x.fill();return}
  for(let i=1;i<s.p.length;i++){ // espessura varia com a pressão da caneta
    x.lineWidth=s.s*k*(.5+(s.p[i][2]||.5));x.beginPath();
    x.moveTo(s.p[i-1][0]*k,s.p[i-1][1]*k);x.lineTo(s.p[i][0]*k,s.p[i][1]*k);x.stroke()}
}

/* ---------- Gestos: caneta/mouse desenham; dedo rola a página (a menos que "Dedo desenha" esteja ligado) ---------- */
const pt=(d,e)=>{const r=d.getBoundingClientRect();return[(e.clientX-r.left)/zoom,(e.clientY-r.top)/zoom,e.pointerType=='pen'?e.pressure:.5]};
function snap(d){undo.push({n:d.n,j:JSON.stringify([d.p.s,d.p.t,d.p.i])});if(undo.length>60)undo.shift();redo=[]}
function swap(a,b){
  const o=a.pop();if(!o)return;const p=doc.pages[o.n];
  b.push({n:o.n,j:JSON.stringify([p.s,p.t,p.i])});[p.s,p.t,p.i]=JSON.parse(o.j);
  if(sel)select(sel.d,null);ink($$('.pg')[o.n]);save(); // fecha o painel do item selecionado (o objeto foi restaurado)
}
const mx=document.createElement('canvas').getContext('2d');
function tbox(t){mx.font=`${t.s}px "${t.f||'Nunito'}",sans-serif`;const L=t.t.split('\n');return[Math.max(...L.map(l=>mx.measureText(l).width)),L.length*t.s*1.25]}
function hit(p,x,y){
  for(const i of [...p.i].reverse())if(x>=i.x&&x<=i.x+i.w&&y>=i.y&&y<=i.y+i.h)return i;
  for(const t of [...p.t].reverse()){const[w,h]=tbox(t);if(x>=t.x&&x<=t.x+w&&y>=t.y&&y<=t.y+h)return t}
}
function segAt(d,x,y){ // trecho de linha de texto sob o ponto tocado
  let b=null,m=1e9;
  (d.lines||[]).forEach(l=>{const q=Math.abs(l.cy-y);if(q<m&&q<=l.h*.8&&x>=l.x0-l.h*2&&x<=l.x1+l.h*2){m=q;b=l}});
  return b}
function bands(d,A,xs,x,y){ // faixas do marca-texto entre o ponto inicial (xs) e o ponto atual, como uma seleção de texto
  const col=d.lines.filter(l=>l.x0<A.x1&&l.x1>A.x0).sort((a,b)=>a.cy-b.cy); // linhas da mesma coluna
  let B=A,m=1e9;col.forEach(l=>{const q=Math.abs(l.cy-y);if(q<m){m=q;B=l}});
  const ia=col.indexOf(A),ib=col.indexOf(B),dn=ib>=ia,o=[];
  if(ia==ib)return[[Math.min(xs,x),Math.max(xs,x),A.cy,A.h]];
  for(let i=Math.min(ia,ib);i<=Math.max(ia,ib);i++){
    const l=col[i];let p=l.x0,q=l.x1;
    if(i==ia){if(dn)p=xs;else q=xs}
    if(i==ib){if(dn)q=x;else p=x}
    o.push([Math.min(p,q),Math.max(p,q),l.cy,l.h])}
  return o}
let rcSnap=0;
function recolor(c){ // se há um texto selecionado, a cor escolhida pinta o texto
  if(sel&&sel.it&&!sel.it.src){if(!rcSnap){snap(sel.d);rcSnap=1;setTimeout(()=>rcSnap=0,1500)}sel.it.c=c;ink(sel.d);save()}}
const sizeUi=it=>{$('#tr').value=it.s;$('#tn').textContent=Math.round(it.s)};
function select(d,it){
  const o=sel;sel=it?{d,it}:null;
  $('#ip').style.display=it?'flex':'none';
  if(it){const im=!!it.src;
    $$('#ip .im').forEach(b=>b.style.display=im?'':'none');$$('#ip .tx').forEach(b=>b.style.display=im?'none':'');
    if(im)$('#ib').textContent=it.b?'⬆️ Na frente do texto':'⬇️ Atrás do texto';else{$('#tf').value=it.f||'Nunito';sizeUi(it)}}
  if(o&&o.d!=d)ink(o.d);
  if(d)ink(d);
}
function erase(d,x,y){
  const p=d.p,n=p.s.length;
  p.s=p.s.filter(s=>!(s.bands?s.bands.some(b=>x>=b[0]-4&&x<=b[1]+4&&Math.abs(y-b[2])<b[3]/2+4)
    :s.sn?(Math.abs(y-s.p[0][1])<s.h/2+4&&x>=Math.min(s.p[0][0],s.p[1][0])-6&&x<=Math.max(s.p[0][0],s.p[1][0])+6)
    :s.p.some(q=>Math.hypot(q[0]-x,q[1]-y)<12)));
  const h=hit(p,x,y);
  if(h){p.t=p.t.filter(t=>t!=h);p.i=p.i.filter(i=>i!=h)}
  if(h||p.s.length!=n)ink(d);
}
function addText(d,x,y,it){ // it = texto existente (modo editar)
  const fs=it?it.s:tsz,a=document.createElement('textarea');

/* ---------- Exportar PDF anotado (cada página vira imagem com as anotações) ---------- */
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)};
/* monta a página pronta (fundo + imagens atrás + PDF + anotações) - usado na exportação e nas miniaturas */
async function compose(p,k){
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(p.w*k));c.height=Math.max(1,Math.round(p.h*k));
  const x=c.getContext('2d');x.fillStyle=pageColor(p);x.fillRect(0,0,c.width,c.height);
  await Promise.all(p.i.map(i=>{const m=getImg(i.src);return m.complete&&m.naturalWidth?0:new Promise(r=>m.addEventListener('load',r))}));
  paintU(x,p,k);
  const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;const y=c2.getContext('2d');
  if(p.cover)paintCover(y,p,k);
  else if(pdf&&p.pi!==undefined){const pg=await pdf.getPage(p.pi+1);await pg.render({canvasContext:y,viewport:pg.getViewport({scale:k})}).promise}
  else bg(y,p,k);
  x.globalCompositeOperation=pageColor(p)=='#fff'?'multiply':'source-over';x.drawImage(c2,0,0);x.globalCompositeOperation='source-over';
  paint(x,p,k);return c;
}
$('#ex').onclick=async e=>{
  const b=e.currentTarget,h=b.innerHTML;b.innerHTML='<i>⏳</i><b>Gerando</b>';
  try{
    const out=await PDFLib.PDFDocument.create();
    for(const p of doc.pages){
      const c=await compose(p,2);
      const jpg=await out.embedJpg(await(await new Promise(r=>c.toBlob(r,'image/jpeg',.9))).arrayBuffer());
      out.addPage([p.w,p.h]).drawImage(jpg,{x:0,y:0,width:p.w,height:p.h});
    }
    dl(new Blob([await out.save()],{type:'application/pdf'}),doc.name+' (anotado).pdf');
  }catch(err){alert('Não foi possível exportar: '+err.message)}
  b.innerHTML=h;
};

/* ---------- Backup e restauração (um único arquivo .json) ---------- */
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function backup(){
  const all=await Promise.all((await getAll()).map(async d=>({...d,pdf:d.pdf?await b64(d.pdf):null})));
  dl(new Blob([JSON.stringify({v:1,docs:all})],{type:'application/json'}),'studylove-backup-'+new Date().toISOString().slice(0,10)+'.json');
}
$('#frest').onchange=async e=>{

  try{const j=JSON.parse(await f.text());
    for(const d of j.docs){if(d.pdf)d.pdf=await(await fetch(d.pdf)).blob();await put(d)}
    alert(j.docs.length+' caderno(s) restaurado(s)! 💗');home()}
  catch{alert('Arquivo de backup inválido.')}
};
